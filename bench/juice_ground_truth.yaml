    verdict: semi
    because: "SESS-10 detect 明写「alg 可改为 none / HS256 弱密钥 / 未校验签名与过期 / kid 注入」—— 归口完全对口。但 session.py 的 WSTG-SESS-10 做的是**解析采集到的 token 做静态结构分析**（alg 字段、缺失 exp 等），不会**伪造一个 alg=none 的 token 再拿去访问接口**。差一步就是「疑似」和「证明」的区别（红线 1：通过只能来自真实执行），故 semi 不抬 auto。"
    witness: "取到的 token 头部 alg=none，伪造后仍能通过校验。"
