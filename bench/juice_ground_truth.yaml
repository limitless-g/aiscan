# ------------------------------- 结论层级 -------------------------------------
# verdict 有五个值，含义见 VERDICT_HELP（生成器内也有副本）：
#   · auto    黑盒可达且有对应检测体：aiscan 清单里存在声明负责该类问题、且适用性标记（app）在 Juice Shop 上成立的检查项。这是「能力上界」，不是实测命中。
#   · semi    有对应检测体，但需前置条件：多账号 / 写授权 / 渲染 / 字典 / 带外（OOB）回调。补齐条件后可自动，不补齐则只能落到人工项。
#   · manual  业务逻辑、多步推理、交互式绕过。按红线 3/32，这类只能作为人工项，标自动等于造假通过。
#   · gap     能力缺口：aiscan 清单中没有任何一项声明负责该类问题。按红线 14，缺口必须显式列出 —— 读者要把「还没做」和「没问题」分开。
#   · na      不适用黑盒扫描：需白盒源码、纯 OSINT 推理、Web3/非 HTTP 协议、DoS（红线 11 明确不做）、或非安全性 Bug（整蛊：Shenanigans）。
