# ==============================================================================
# 扫描目标清单（与扫描逻辑完全解耦）
# ==============================================================================
# 设计   目标定义独立于扫描代码。新增 / 变更目标只改本文件，不动引擎。
#        周期化扫描启用时，本文件即「域名清单」，调度器按 schedule 段执行。
# 视角   一律公网视角；内网目标须在 scope.internal_targets 中显式登记
# 版本   v1.0 | 2026-09-20
# ==============================================================================

meta:
  version: v1.0
  updated: "2026-09-20"
  note: |
    本文件是扫描的唯一目标来源。禁止在扫描代码中硬编码目标。
    添加新目标时，必须同时登记 authorization（授权人 + 授权依据），
    否则引擎将拒绝执行该目标扫描。

# ------------------------------------------------------------------------------
# 全局扫描设置
# ------------------------------------------------------------------------------
settings:
  profile: standard            # 扫描档位：safe / standard / deep
  perspective: public          # 固定公网视角（硬约束，不可改）
  dns_resolvers:               # 公共递归 DNS，交叉验证排除 split-horizon
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8
    - 1.1.1.1
  public_intel_sources:        # 公网测绘平台，用于交叉确认真实暴露
    - shodan_internetdb
    - fofa
    - censys
  output_root: outputs         # 结果归档根目录
  archive_by: target_timestamp # 归档方式：目标+时间戳

# ------------------------------------------------------------------------------
# 周期化扫描预留（当前未启用）
# ------------------------------------------------------------------------------
# 启用方式：把 enabled 改为 true，并设置 schedule。
# 启用后调度器按 targets 列表逐目标扫描，与单次扫描共用同一套扫描内核。
schedule:
  enabled: false               # 当前阶段：单次扫描
  mode: manual                 # manual / daily / weekly / monthly
  cron: ""                     # 启用时填写，如 "0 2 * * 0"（每周日 02:00）
  diff_enabled: true           # 复扫时与上一次结果比对（新增/已修复/仍存在）
  retention_days: 180          # 历史结果保留天数

# ------------------------------------------------------------------------------
# 扫描范围定义
# ------------------------------------------------------------------------------
scope:
  # 公网目标（主战场）
  public_targets: []
  # 内网目标：默认空。填入后引擎要求 profile 显式确认为内网专项，
  # 且其结果不得混入公网风险统计（规格第 7 章硬约束）。
  internal_targets: []
  # 排除项：不应被扫描的域名 / 路径（如第三方托管、已在别处覆盖的资产）
  excluded:
    - "*.gov.cn"
    - "*.edu.cn"

# ------------------------------------------------------------------------------
# 目标登记模板（复制此结构添加目标）
# ------------------------------------------------------------------------------
# targets:
#   - name: 示例系统                          # 目标系统名称
#     primary_domain: www.example.com         # 主域名
#     alt_domains: []                         # 备用域名 / 子域清单
#     system_owner: 系统负责人                # 归属系统负责人
#     business_owner: 业务负责人              # 业务侧负责人
#     classification: 内部重要                # 数据分级（内部机密/内部重要/内部公开/外部公开）
#     environment: production                 # production / staging / test
#     behind_cdn: true                        # 是否在 CDN 后面
#     real_origin_ip: 1.2.3.4                 # 真实源站 IP（若已确认）
#     tech_stack: [nginx, vue, spring-boot]   # 已知技术栈
#     authorization:
#       authorized: true                      # 是否已授权
#       authorizer: 张三                      # 授权人
#       authorization_date: "2026-09-20"      # 授权日期
#       authorization_ref: "邮件 2026-09-20"  # 授权依据（邮件/工单编号）
#       allow_write_test: false               # 是否允许受控写验证
#       test_accounts: []                     # 允许使用的测试账号（不含密码）
#     options:
#       profile_override: null                # 覆盖全局档位
#       skip_items: []                        # 明确跳过的检查项 ID（须说明原因）

targets: []

# ------------------------------------------------------------------------------
# 目标特征预置（加速指纹识别；留空则运行时探测）
# ------------------------------------------------------------------------------
# 引擎会先做指纹识别，自动推导这些特征；此处可预置已知值以跳过探测。
features_override: {}
# 例如：
# features_override:
#   www.example.com:
#     has_login: true
#     has_api: true
#     has_upload: false
